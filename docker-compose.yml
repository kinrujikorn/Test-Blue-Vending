services:
  backend:
    build: ./backend/
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend/blue-vending/
    ports:
      - "3000:3000"
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: vending_machine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
